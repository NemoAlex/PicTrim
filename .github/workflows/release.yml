name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          export RELEASE_VERSION="${version}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          node -e 'const pkg=require("./package.json"); if (pkg.version !== process.env.RELEASE_VERSION) { throw new Error(`package.json version ${pkg.version} does not match ${process.env.RELEASE_VERSION}`) }'
          node -e 'const cfg=require("./src-tauri/tauri.conf.json"); if (cfg.version !== process.env.RELEASE_VERSION) { throw new Error(`tauri.conf.json version ${cfg.version} does not match ${process.env.RELEASE_VERSION}`) }'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install vips

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "8.18.3"
          $url = "https://github.com/libvips/build-win64-mxe/releases/download/v$version/vips-dev-x64-all-$version.zip"
          $archive = Join-Path $env:RUNNER_TEMP "vips.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "vips"

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractDir

          $vipsDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          if (-not $vipsDir) {
            throw "Could not find extracted libvips directory."
          }

          echo "VIPS_DIR=$($vipsDir.FullName)" >> $env:GITHUB_ENV
          echo "$($vipsDir.FullName)\bin" >> $env:GITHUB_PATH

      - name: Build release artifacts
        run: npm run tauri:build

      - name: Package Windows release artifacts
        if: runner.os == 'Windows'
        run: npm run release:package

      - name: Sign, notarize, and package macOS release artifacts
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/sign-and-package-macos.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicTrim-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  ./#  #' > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          draft="${INPUT_DRAFT:-true}"
          draft_flag=""
          if [ "${draft}" = "true" ]; then
            draft_flag="--draft"
          fi

          gh release create "v${version}" release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PicTrim v${version}" \
            --notes-file - \
            ${draft_flag} <<'EOF'
          ## Downloads

          - Windows: download the installer or portable zip.
          - macOS: download the signed and notarized DMG, or the portable zip.

          ## Security Notice

          macOS builds are signed with a Developer ID certificate and notarized by Apple. Windows builds are currently unsigned and may show a SmartScreen warning the first time you open the app.

          To verify the download, compare the file checksum with the `SHA256SUMS.txt` included in this release.

          Windows users may need to choose "More info", then "Run anyway" in SmartScreen.

          ---

          ## 下载

          - Windows：下载 installer 或 portable zip。
          - macOS：下载已签名并通过 Apple 公证的 DMG，或 portable zip。

          ## 安全提示

          macOS 构建已使用 Developer ID 证书签名并通过 Apple 公证。Windows 构建目前尚未签名，首次打开时可能显示 SmartScreen 警告。

          如需校验下载文件，请对照本 release 附带的 `SHA256SUMS.txt`。

          Windows 用户可能需要在 SmartScreen 中选择“更多信息”，然后选择“仍要运行”。
          EOF
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
