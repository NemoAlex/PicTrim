name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: release/*.exe
          - name: macos-arm64
            os: macos-15
            artifact: release/*.dmg
          - name: macos-x64
            os: macos-15-intel
            artifact: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          export RELEASE_VERSION="${version}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          node -e 'const pkg=require("./package.json"); if (pkg.version !== process.env.RELEASE_VERSION) { throw new Error(`package.json version ${pkg.version} does not match ${process.env.RELEASE_VERSION}`) }'
          node -e 'const cfg=require("./src-tauri/tauri.conf.json"); if (cfg.version !== process.env.RELEASE_VERSION) { throw new Error(`tauri.conf.json version ${cfg.version} does not match ${process.env.RELEASE_VERSION}`) }'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install vips

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "8.18.3"
          $url = "https://github.com/libvips/build-win64-mxe/releases/download/v$version/vips-dev-x64-all-$version.zip"
          $archive = Join-Path $env:RUNNER_TEMP "vips.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "vips"

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extractDir

          $vipsDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          if (-not $vipsDir) {
            throw "Could not find extracted libvips directory."
          }

          echo "VIPS_DIR=$($vipsDir.FullName)" >> $env:GITHUB_ENV
          echo "$($vipsDir.FullName)\bin" >> $env:GITHUB_PATH

      - name: Build release artifacts
        run: npm run tauri:build

      - name: Sign, notarize, and package macOS release artifacts
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/sign-and-package-macos.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PicTrim-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          draft="${INPUT_DRAFT:-false}"
          draft_flag=""
          if [ "${draft}" = "true" ]; then
            draft_flag="--draft"
          fi

          tag="v${version}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"

            while IFS= read -r asset; do
              if [ ! -f "release-artifacts/${asset}" ]; then
                gh release delete-asset "$tag" "$asset" \
                  --yes \
                  --repo "${GITHUB_REPOSITORY}"
              fi
            done < <(gh release view "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name')

            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" \
              --jq '.body' > release-notes.md
            gh release edit "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PicTrim v${version}" \
              --notes-file release-notes.md
          else
            gh release create "$tag" release-artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "PicTrim v${version}" \
              --generate-notes \
              ${draft_flag}
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
