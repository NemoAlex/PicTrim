[package]
name = "pictrim"
version = "0.1.5"
description = "Fast batch image resizing"
authors = ["PicTrim"]
license = "MIT"
edition = "2021"

[lib]
name = "pictrim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rs-vips = "0.7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"
